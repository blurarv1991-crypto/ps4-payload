name: Payload

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Bajar mi repo
        uses: actions/checkout@v4

      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y bash git make clang-18 lld-18

      - name: Bajar el SDK
        run: git clone --depth 1 https://github.com/ps4-payload-dev/sdk /tmp/sdk

      - name: Instalar el SDK
        run: |
          cd /tmp/sdk
          sudo make DESTDIR=/opt/ps4-payload-sdk install

      - name: Compilar mi payload
        run: |
          export PS4_PAYLOAD_SDK=/opt/ps4-payload-sdk
          ok=0
          for l in "-lkernel_sys" "-lkernel" "-lSceLibcInternal" ""; do
            echo "=== Probando LDLIBS=$l ==="
            make clean
            if make LDLIBS="$l"; then
              echo "=== OK con LDLIBS=$l ==="
              ok=1
              break
            fi
          done
          test "$ok" = 1
          mkdir -p salida
          cp aviso.elf salida/

      - name: Subir el .elf
        uses: actions/upload-artifact@v4
        with:
          name: aviso-elf
          path: salida/aviso.elf
